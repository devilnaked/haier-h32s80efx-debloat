plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.atvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.atvhome'
        minSdk 34
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
